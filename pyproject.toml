[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-siem"
version = "0.1.0"
description = "AEGIS Security Intelligence & Operations Platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.135.1", "uvicorn==0.41.0", "pydantic-settings==2.14.2",
  "sqlalchemy==2.0.48", "alembic==1.18.4", "psycopg[binary]==3.3.3",
  "redis==7.3.0", "opensearch-py==3.1.0", "argon2-cffi==25.1.0",
  "httpx==0.28.1", "typer==0.24.1", "rich==14.3.3", "pyyaml==6.0.3",
  "prometheus-client==0.24.1", "cryptography>=43.0.0"
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "pytest-cov==7.0.0", "ruff==0.15.6", "mypy==1.19.1", "types-PyYAML==6.0.12.20250915", "pip-audit==2.10.0", "bandit==1.9.4"]

[project.scripts]
aegis = "aegis.cli:app"
aegis-worker = "aegis.worker:main"
aegis-retention = "aegis.retention:main"

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL, Redis and OpenSearch"]
addopts = "--basetemp=.pytest_temp"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "S"]
ignore = ["B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"aegis/agent.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
