name: AEGIS verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -c requirements.lock -e '.[dev]'
      - run: npm --prefix web ci
      - run: python scripts/configure.py
      - run: python scripts/dev.py lint
      - run: python scripts/dev.py typecheck
      - run: pytest --cov=aegis --cov-report=term-missing
      - run: aegis rules test --all
      - run: npm --prefix web test
      - run: python scripts/dev.py security
      - run: npm --prefix web run build
      - run: cd web && npx playwright install --with-deps chromium
      - run: python scripts/e2e.py
      - run: docker compose up -d --build --wait
      - run: python scripts/dev.py integration
      - run: python scripts/acceptance.py
      - run: docker compose exec -T api python scripts/integration_checks.py
      - name: Search outage and durable outbox recovery
        run: python scripts/failure_drill.py
      - run: python scripts/recovery_drill.py
      - run: python scripts/compose_e2e.py
      - name: Scan API image
        uses: aquasecurity/trivy-action@0.35.0
        with: {image-ref: 'aegis-api:local', format: table, exit-code: '1', severity: 'HIGH,CRITICAL', ignore-unfixed: true}
      - name: Scan web image
        uses: aquasecurity/trivy-action@0.35.0
        with: {image-ref: 'aegis-web:local', format: table, exit-code: '1', severity: 'HIGH,CRITICAL', ignore-unfixed: true}
      - name: API SBOM
        uses: anchore/sbom-action@v0
        with: {image: 'aegis-api:local', format: cyclonedx-json, output-file: aegis-api.cdx.json}
      - name: Web SBOM
        uses: anchore/sbom-action@v0
        with: {image: 'aegis-web:local', format: cyclonedx-json, output-file: aegis-web.cdx.json}
      - name: Retain image SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: image-sboms
          path: |
            aegis-api.cdx.json
            aegis-web.cdx.json
          if-no-files-found: error
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: always()
        run: docker compose logs --tail=100 api worker initialize
      - if: always()
        run: docker compose down
